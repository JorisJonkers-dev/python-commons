[project]
name = "jorisjonkers-commons"
version = "0.0.0"
description = "Shared Python packages for estate services."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-JorisJonkers-Proprietary-1.0"
license-files = ["LICENSE"]
dependencies = [
  "cryptography>=44",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jorisjonkers_commons"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-p", "no:cacheprovider"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jorisjonkers_commons"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
